[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyFiberModes"
version = "1.0.0"
description = "Guided-mode analysis and design for circular optical fibers."
license = {file = "LICENSE"}
readme = "README.rst"
requires-python = ">=3.11"
authors = [{ name="Martin Poinsinet de Sivry-Houle", email="martin.poinsinet.de.sivry@gmail.com"}]
classifiers = [
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: Implementation :: CPython',
    'Development Status :: 4 - Beta',
    'Topic :: Scientific/Engineering :: Physics',
    'License :: OSI Approved :: MIT License',
    'Intended Audience :: Science/Research',
]

keywords = [
    "fiber optics",
    "guided modes",
    "mode solver",
    "optical waveguides",
    "photonics",
    "dispersion",
    "coupled-mode theory",
]

dependencies = [
    "PyFinitDiff",
    "TypedUnit>=0.2.9",
    "pint>=0.24,<0.26",
    "pyyaml",
    "numpy",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/MartinPdeS/PyFiberModes"
Repository = "https://github.com/MartinPdeS/PyFiberModes"
Issues = "https://github.com/MartinPdeS/PyFiberModes/issues"
Documentation = "https://martinpdes.github.io/PyFiberModes/"

[tool.setuptools]
packages = {find = {where = ["."], include = ["PyFiberModes*"]}}
include-package-data = true


[project.optional-dependencies]
release = ["martinpdes-maintenance==0.2.2"]
testing = ["martinpdes-maintenance==0.2.2",
    "pytest >=7.4,<10.0",
    "pytest-cov >=2,<8",
    "pytest-json-report ~=1.5",
    "coverage ~=7.6",
    "ruff>=0.8,<1",
    "matplotlib>=3.8",
    "mypy>=1.15,<3",
]

plotting = [
    "matplotlib>=3.8",
]

benchmarking = [
    "pytest-benchmark>=5,<6",
]


documentation = [
    "MartinPdeS-docs>=0.4.0,<0.5",
    "matplotlib>=3.8",
]

dev = [
    "ruff>=0.8,<1",
    "mypy>=1.15,<3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
ignore_missing_imports = true
files = [
    "PyFiberModes/materials.py",
    "PyFiberModes/solver/protocols.py",
    "PyFiberModes/solver/results.py",
]

# Include runtime resources when building wheels from a source archive without Git.
[tool.setuptools.package-data]
PyFiberModes = ["fiber_files/*.yaml"]

[tool.mps-maintenance]
version-file = "PyFiberModes/_version.py"
version-method = "literal"
conda-recipe = "conda.recipe/meta.yaml"
zenodo = ".zenodo.json"
changelog = "CHANGELOG.md"
repository = "MartinPdeS/PyFiberModes"
