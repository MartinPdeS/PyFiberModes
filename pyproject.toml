[build-system]
requires = ["setuptools>=40.8.0", "wheel", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyFiberModes"
version = "0.12.0"
description = "A package for light propagation in fiber optics."
license = {file = "LICENSE"}
readme = "README.rst"
requires-python = ">=3.10"
authors = [{ name="Martin Poinsinet de Sivry-Houle", email="martin.poinsinet.de.sivry@gmail.com"}]
classifiers = [
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: Implementation :: CPython',
    'Development Status :: 4 - Beta',
    'Topic :: Scientific/Engineering :: Physics',
    'License :: OSI Approved :: MIT License',
    'Intended Audience :: Science/Research',
]

keywords = ["finit-difference", "matrix"]

dependencies = [
    "PyOptik>=2,<3",
    "MPSPlots",
    "PyFinitDiff",
    "pyyaml",
    "numpy",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/MartinPdeS/PyFiberModes"
Repository = "https://github.com/MartinPdeS/PyFiberModes"
Issues = "https://github.com/MartinPdeS/PyFiberModes/issues"
Documentation = "https://martinpdes.github.io/PyFiberModes/"

[tool.setuptools]
packages = {find = {where = ["."], include = ["PyFiberModes*"]}}
include-package-data = true


[tool.setuptools_scm]
write_to = "PyFiberModes/_version.py"
version_scheme = "only-version"
local_scheme = "no-local-version"

[project.optional-dependencies]
testing = [
    "pytest >=7.4,<9.0",
    "pytest-cov >=2,<8",
    "pytest-json-report ~=1.5",
    "coverage ~=7.6",
    "ruff>=0.8,<1",
    "tomli>=2,<3; python_version<'3.11'",
]


documentation = [
    "numpydoc ==1.9.0",
    "sphinx >=5.1.1",
    "sphinx-gallery ==0.21.0",
    "sphinx-rtd-theme ==3.1.0",
    "pydata-sphinx-theme ==0.17.1",
]

dev = [
    "ruff>=0.8,<1",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"PyFiberModes/solver/mlsif/neff.py" = ["F821", "F841"]
