name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python for release validation
        uses: MartinPdeS/MPSActions/actions/setup-python@0f5927acf88b25b5d253421e508387897096a2cc
        with:
          python-version: "3.11"
          install-command: "true"
          fetch-depth: 0
      - run: python tools/check_release.py --version "${GITHUB_REF_NAME}"

  publish:
    needs: validate-release
    uses: MartinPdeS/MPSActions/.github/workflows/publish_pure_package_to_PyPi.yml@v5
    with:
      python-version: "3.11"
      test-command: python -c 'import PyFiberModes'
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
