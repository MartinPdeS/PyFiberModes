name: Publish documentation
'on':
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
permissions:
  contents: read
jobs:
  documentation:
    permissions:
      contents: read
    uses: MartinPdeS/MPSActions/.github/workflows/build_documentation.yml@v2
    with:
      python-version: '3.11'
      package-name: PyFiberModes
      apt-package: xvfb jq
      debug: true
