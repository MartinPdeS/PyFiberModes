name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    uses: MartinPdeS/MPSActions/.github/workflows/run_quality.yml@v2
    with:
      install-command: >-
        python -m pip install --upgrade pip && python -m pip install -e ".[dev,release]"
      quality-command: |
        python -m ruff check PyFiberModes tests
        python -m mypy
        python -m martinpdes_maintenance.cli check
