name: Publish Conda package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python for release validation
        uses: MartinPdeS/MPSActions/actions/setup-python@0f5927acf88b25b5d253421e508387897096a2cc
        with:
          python-version: "3.11"
          install-command: "true"
          fetch-depth: 0
      - run: python tools/check_release.py --version "${GITHUB_REF_NAME}"

  publish:
    needs: validate-release
    uses: MartinPdeS/MPSActions/.github/workflows/publish_compiled_package_to_anaconda.yml@v6
    with:
      # The recipe is ``noarch: python``. Building it in a platform/version
      # matrix creates several artifacts with the same archive path, which
      # collide when the reusable workflow merges them before upload.
      # One noarch archive supports all declared Python versions; test it on 3.14.
      python_versions: '["3.14"]'
      os_list: '["ubuntu-latest"]'
      package_name: pyfibermodes
      recipe_path: conda.recipe
      test_import: PyFiberModes
    secrets:
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
