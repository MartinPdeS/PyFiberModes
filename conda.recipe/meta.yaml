package:
  name: pyfibermodes
  version: 0.16.0

source:
  path: ../

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

channels:
  - conda-forge
  - martinpdes

requirements:
  host:
    - python >=3.11
    - setuptools >=40.8.0
    - wheel
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=3.11
    - martinpdes::pyfinitdiff
    - pyyaml
    - numpy
    - scipy

about:
  home: https://github.com/MartinPdeS/PyFiberModes
  license: MIT
  summary: "Guided-mode analysis and design for circular optical fibers."
  description: PyFiberModes solves guided modes in circularly symmetric step-index and multilayer optical fibers.
  dev_url: https://github.com/MartinPdeS/PyFiberModes
  doc_url: https://martinpdes.github.io/PyFiberModes/
  license_file: LICENSE
  keywords:
    - fiber optics
    - guided modes
    - mode solver
    - optical waveguides
    - photonics
    - dispersion

test:
  imports:
    - PyFiberModes
  requires:
    - python >=3.11
    - matplotlib>=3.8
    - pytest>=0.6
    - pytest-cov>=2.0
    - pytest-json-report==1.5.0
    - coverage==7.6.1
  commands:
    - python -m pytest
  source_files:
    - tests

extra:
  recipe-maintainers:
    - MartinPdeS
